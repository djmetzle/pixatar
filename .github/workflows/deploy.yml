name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cargo Cache
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install
        run: cargo build

      - name: Build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install trunk --version 0.22.1 --locked
          trunk build --release

      - name: AWS login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Update site
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: aws --region us-west-2 s3 sync --delete ./dist "s3://$SITE_BUCKET/"

      - name: The manifest's type
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          if [ -f dist/manifest.webmanifest ]; then
            aws --region us-west-2 s3 cp dist/manifest.webmanifest "s3://$SITE_BUCKET/manifest.webmanifest" --content-type application/manifest+json
            test "$(aws --region us-west-2 s3api head-object --bucket "$SITE_BUCKET" --key manifest.webmanifest --query ContentType --output text)" = application/manifest+json
          fi

      - name: Invalidate Cloudfront
        env:
          DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
